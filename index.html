<!doctype html>
<html lang="en">
  <head>
    <script>
      const getAppPreference = () => {
        if (
          typeof localStorage !== "undefined" &&
          localStorage.getItem("app-preferences")
        ) {
          return JSON.stringify(localStorage.getItem("app-preferences"));
        } else {
          return {
            pomodoroTime: 25,
            shortBreakTime: 5,
            longBreakTime: 15,
            font: "sans",
            color: "red",
          };
        }
      };

      const appPreference = getAppPreference();
      document.documentElement.setAttribute("data-theme", appPreference.color);
      document.documentElement.setAttribute("data-font", appPreference.font);
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
