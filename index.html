<!doctype html>
<html lang="en">
  <head>
    <script>
      const getAppPreference = () => {
        const defaultPrefs = {
          pomodoroTime: 25,
          shortBreakTime: 5,
          longBreakTime: 15,
          font: "sans",
          color: "red",
        };

        if (typeof localStorage !== "undefined") {
          const storedPrefs = localStorage.getItem("app-preferences");
          if (storedPrefs) {
            try {
              const parsedPrefs = JSON.parse(storedPrefs);
              return { ...defaultPrefs, ...parsedPrefs };
            } catch (error) {
              console.warn("Corrupted app-preferences. Reverting to defaults.");
            }
          }
        }

        return defaultPrefs;
      };

      const appPreference = getAppPreference();

      document.documentElement.setAttribute("data-theme", appPreference.color);
      document.documentElement.setAttribute("data-font", appPreference.font);
    </script>
    <meta charset="UTF-8" />

</html>
